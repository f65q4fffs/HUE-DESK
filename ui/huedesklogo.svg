<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ombre douce sous le boîtier -->
    <filter id="shadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.06" />
    </filter>

    <!-- Ombre interne du bouton central -->
    <filter id="insetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="2" />
      <feGaussianBlur stdDeviation="3" result="offset-blur" />
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
      <feFlood flood-color="#000000" flood-opacity="0.1" result="color" />
      <feComposite operator="in" in="color" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>

    <!-- Dégradé spectral du halo lumineux -->
    <linearGradient id="gradientRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Diffusion du halo -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" />
    </filter>
  </defs>

  <!-- Fond contrastant -->
  <rect width="512" height="512" fill="#f8fafc" />

  <!-- Boîtier principal blanc (squircle) -->
  <rect x="76" y="76" width="360" height="360" rx="98" ry="98" fill="#ffffff" filter="url(#shadow)" />
  <rect x="76" y="76" width="360" height="360" rx="98" ry="98" fill="none" stroke="#f1f5f9" stroke-width="2" />

  <!-- LES 3 VOYANTS DU HAUT (Centrés sur X:256, Y:136) -->
  <g fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- 1. Power (Gauche : X = 208) -->
    <g transform="translate(208, 136)">
      <path d="M -5.5,-3.5 A 7.5 7.5 0 1 0 5.5,-3.5" />
      <line x1="0" y1="-7.5" x2="0" y2="-1" />
    </g>

    <!-- 2. Local Network (Centre exact : X = 256) -->
    <g transform="translate(256, 136)">
      <rect x="-3" y="-8" width="6" height="5" rx="1" />
      <rect x="-8.5" y="3" width="6" height="5" rx="1" />
      <rect x="2.5" y="3" width="6" height="5" rx="1" />
      <line x1="0" y1="-3" x2="0" y2="0.5" />
      <line x1="-5.5" y1="0.5" x2="5.5" y2="0.5" />
      <line x1="-5.5" y1="0.5" x2="-5.5" y2="3" />
      <line x1="5.5" y1="0.5" x2="5.5" y2="3" />
    </g>

    <!-- 3. Internet / Globe (Droite : X = 304) -->
    <g transform="translate(304, 136)">
      <circle cx="0" cy="0" r="7.5" />
      <line x1="-7.5" y1="0" x2="7.5" y2="0" />
      <ellipse cx="0" cy="0" rx="3.5" ry="7.5" />
    </g>
  </g>

  <!-- Halo lumineux dégradé -->
  <circle cx="256" cy="268" r="70" fill="none" stroke="url(#gradientRing)" stroke-width="24" filter="url(#glow)" opacity="0.65" />
  <circle cx="256" cy="268" r="62" fill="none" stroke="url(#gradientRing)" stroke-width="14" />
  <circle cx="256" cy="268" r="69" fill="none" stroke="#000000" stroke-width="2" opacity="0.04" />

  <!-- Bouton central blanc -->
  <circle cx="256" cy="268" r="54" fill="#ffffff" filter="url(#insetShadow)" />
  <circle cx="256" cy="268" r="54" fill="none" stroke="#f1f5f9" stroke-width="1.5" />

  <!-- Texte central HUE-DESK -->
  <text x="256" y="273" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="800" font-size="12" fill="#64748b" letter-spacing="1.2" text-anchor="middle">HUE-DESK</text>
</svg>