<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Dégradé spectral simplifié à fort contraste -->
    <linearGradient id="trayGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />   <!-- Cyan clair -->
      <stop offset="50%" stop-color="#c084fc" />  <!-- Violet clair -->
      <stop offset="100%" stop-color="#fb923c" /> <!-- Ambre vif -->
    </linearGradient>
  </defs>

  <!-- Boîtier Squircle blanc épuré -->
  <rect x="2" y="2" width="28" height="28" rx="8" ry="8" fill="#ffffff" />
  <rect x="2" y="2" width="28" height="28" rx="8" ry="8" fill="none" stroke="#cbd5e1" stroke-width="1" />

  <!-- Anneau dégradé Hue -->
  <circle cx="16" cy="16" r="8" fill="none" stroke="url(#trayGradient)" stroke-width="3" />

  <!-- Bouton central blanc -->
  <circle cx="16" cy="16" r="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
</svg>
